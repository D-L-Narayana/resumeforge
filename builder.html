<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resume Builder — ResumeForge</title>
<meta name="description" content="Live resume builder with real-time ATS scoring and one-click PDF export.">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/builder.css">
<link rel="stylesheet" href="css/keyboard.css">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/components.css"></head>
<body class="builder">
<div class="topbar">
<a class="logo" href="index.html"><svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0071e3"/><stop offset=".55" stop-color="#00a2ff"/><stop offset="1" stop-color="#00c7be"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="#0071e3"/><path d="M11 23V9h7.2a4.3 4.3 0 0 1 1.4 8.4L23 23h-3.6l-3-5H14v5z" fill="#fff"/></svg>Resume<span>Forge</span></a>
<div class="top-actions">
<a class="btn btn-ghost" href="coverletter.html">Cover letter</a><a class="btn btn-ghost" href="salary.html">Salary</a>
<select id="templateSelect" aria-label="Template"></select>
<div id="scoreChip" class="score-chip">ATS —</div>
<button class="btn btn-primary" id="printBtn">Download PDF</button>
</div>
</div>
<main class="builder-main">
<aside class="panel">
<h2 class="ptitle">Your details</h2>
<div class="row2">
<div class="fgroup"><label>Full name</label><input id="fName"></div>
<div class="fgroup"><label>Job title</label><input id="fTitle"></div>
</div>
<div class="row2">
<div class="fgroup"><label>Email</label><input id="fEmail" type="email"></div>
<div class="fgroup"><label>Phone</label><input id="fPhone"></div>
</div>
<div class="fgroup"><label>Location</label><input id="fLocation"></div>
<div class="fgroup"><label>Professional summary</label><textarea id="fSummary"></textarea></div>
<div class="fgroup"><label>Skills (comma separated)</label><input id="fSkills"></div>
<h2 class="ptitle">Experience</h2>
<div id="expList"></div>
<button id="addExp" class="addbtn">+ Add experience</button>
<h2 class="ptitle">Education</h2>
<div id="eduList"></div>
<button id="addEdu" class="addbtn">+ Add education</button>
<h2 class="ptitle">ATS checks</h2>
<div id="scoreChecks" class="checks"></div>
<h2 class="ptitle">Job match</h2>
<div class="fgroup"><label>Paste job description</label><textarea id="fJD" placeholder="Paste the job post here to see keyword coverage..."></textarea></div>
<div id="matchResult" class="checks"><div class="check">Paste a job description to see keyword coverage.</div></div>
<h2 class="ptitle">Bullet doctor</h2>
<div id="doctorBox" class="checks"></div>
</aside>
<section class="stage">
<div id="paper" class="paper t-modern"></div>
</section>
</main>
<script src="js/data.js"></script>
<script src="js/ats.js"></script>
<script src="js/match.js"></script>
<script src="js/examples.js"></script>
<script src="js/bulletlib.js"></script>
<script src="js/builder.js"></script>
<script src="vendor/gsap.min.js"></script><script src="js/fx.js"></script><script src="js/keyboard.js"></script><script src="js/components.js"></script><script src="js/theme.js"></script></body>
</html>
